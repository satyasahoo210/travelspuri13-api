name: pms_docker

services:
  postgres:
    image: postgres
    container_name: pms_postgres
    restart: always
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
      POSTGRES_DB: pms_db
    ports:
      - "5432:5432"
    networks:
      - pms_network

  redis:
    image: redis:7
    container_name: pms_redis
    ports:
      - "6379:6379"
    networks:
      - pms_network

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pms_backend
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    networks:
      - pms_network

networks:
  pms_network:
    driver: bridge
